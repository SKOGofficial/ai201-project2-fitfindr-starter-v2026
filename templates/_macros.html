{% macro category_art(category) %}
{% set cat = category|lower if category else 'accessories' %}
<div class="art art-{{ cat }}">
  {% if cat == 'tops' %}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3L3 7v4h3v10h12V11h3V7l-5-4-2 2h-4L8 3z"/></svg>
  {% elif cat == 'bottoms' %}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3h14l1 7-1 11h-4l-2-9-2 9H6L5 10 4 3z"/><path d="M5 3h14"/></svg>
  {% elif cat == 'outerwear' %}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3L3 6l2 4 2-1v12h10V9l2 1 2-4-4-3-3 2h-4L7 3z"/><path d="M12 5v6"/></svg>
  {% elif cat == 'shoes' %}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c0-2 1-3 3-4l4-2 2-3 3 1-1 3 6 2c1.5.5 2 1.5 2 3v2H3v-2z"/><path d="M9 11l2 3"/></svg>
  {% else %}
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9V7a5 5 0 0110 0v2"/><rect x="4" y="9" width="16" height="11" rx="2"/></svg>
  {% endif %}
</div>
{% endmacro %}
